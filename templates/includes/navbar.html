<nav class="navbar">
  <a href="{% url 'home' %}" class="logo">Student Profile Maker</a>
  <button type="button" id="menu-btn" class="icon-btn menu-btn" aria-label="Open menu">&#9776;</button>
  <ul id="nav-links" class="nav-links">
    <li><a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a></li>
    {% if user.is_authenticated %}
      <li><a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Edit profile</a></li>
      <li><a href="{% url 'manage' %}" {% if request.resolver_match.url_name == 'manage' %}class="active"{% endif %}>My content</a></li>
      <li><a href="{% url 'public_profile' user.username %}">My page</a></li>
      <li>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="link-btn">Log out</button>
        </form>
      </li>
    {% else %}
      <li><a href="{% url 'login' %}" {% if request.resolver_match.url_name == 'login' %}class="active"{% endif %}>Log in</a></li>
      <li><a href="{% url 'signup' %}" class="btn btn-small">Sign up</a></li>
    {% endif %}
    <li><button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">Dark</button></li>
  </ul>
</nav>
